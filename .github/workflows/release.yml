name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve release version
        id: version
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Check canonical SLMP profile JSONs
        shell: pwsh
        run: ./scripts/update_slmp_profile_jsons.ps1 -FailIfChanged

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node test/run-tests.js

      - name: Pack npm package
        run: npm pack

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          version="${tag#v}"
          header="## [${version}]"
          asset="fa_yoshinobu-node-red-contrib-plc-comm-slmp-${{ steps.version.outputs.version }}.tgz"
          test -f "${asset}"
          if ! changelog_notes="$(
            awk -v header="${header}" '
              index($0, header) == 1 { capture = 1 }
              capture && /^## \[/ && index($0, header) != 1 { exit }
              capture { print }
              END { if (!capture) exit 1 }
            ' CHANGELOG.md
          )"; then
            echo "::error::CHANGELOG.md is missing release section ${header}."
            exit 1
          fi
          test -n "${changelog_notes}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            current_body="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body)"
            if ! grep -Fq -- "${header}" <<<"${current_body}"; then
              notes_file="${RUNNER_TEMP}/release-notes-${version}.md"
              printf '%s\n\n%s\n' "${changelog_notes}" "${current_body}" > "${notes_file}"
              gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --title "Release ${tag}" --notes-file "${notes_file}"
            fi
            gh release upload "${tag}" "${asset}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${tag}" "${asset}" --repo "${GITHUB_REPOSITORY}" --title "Release ${tag}" --notes "${changelog_notes}" --generate-notes --verify-tag --draft
          fi
